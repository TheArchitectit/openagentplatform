name: Go

on:
  push:
    branches: [main, 'sprint/**']
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "a2a/**"
      - "secrets/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main, 'sprint/**']
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "a2a/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go.yml"

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Match go.mod: golangci-lint releases are built with a
          # specific Go, and a binary older than the module's go
          # directive cannot load the packages at all ("the Go language
          # version used to build golangci-lint is lower than the
          # targeted Go version").
          go-version: "1.26"
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # Gate new code only: the tree carries pre-existing findings
          # that predate this workflow.
          args: --timeout=5m --new-from-rev=${{ github.event.pull_request.base.sha || github.sha }}

  test:
    name: Test (Go ${{ matrix.go-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.os }}-${{ matrix.go-version }}
          path: coverage.out
