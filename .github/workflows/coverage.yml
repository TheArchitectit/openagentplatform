name: Coverage + Quality Gate

on:
  pull_request:
    branches: [main, 'sprint/**']
  push:
    branches: [main]

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          # Check only main source directories (exclude .claude/worktrees and examples)
          unformatted=$(gofmt -l ./cmd ./internal ./pkg ./a2a ./secrets ./gate 2>/dev/null)
          if [ -n "$unformatted" ]; then
            echo "gofmt issues in:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests with coverage
        run: |
          gotestsum --junitfile junit.xml -- \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -count=1 \
            ./...

      - name: Per-package coverage breakdown
        run: |
          echo "### Coverage by package"
          echo '```'
          go tool cover -func=coverage.out | grep -E "^(github.com.*internal/|github.com.*pkg/|github.com.*cmd/)" | awk -F'\t' '{print $1, $3}'
          echo '```'

      - name: Check P1 package threshold (≥80%)
        run: |
          # P1 packages: internal/api, internal/alerts, internal/patches
          # Fail if any P1 package drops below 80% line coverage
          THRESHOLD=80
          FAILED=""
          for pkg in internal/api internal/alerts internal/patches; do
            avg=$(go tool cover -func=coverage.out | grep "$pkg/" | awk -F'\t' '
              { split($3, p, "%"); sum += p[1]; n++ }
              END { if (n > 0) printf "%.1f", sum/n; else print "0" }
            ')
            echo "$pkg: ${avg}%"
            below=$(echo "$avg < $THRESHOLD" | bc -l)
            if [ "$below" = "1" ]; then
              FAILED="$FAILED $pkg(${avg}%)"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "FAIL: P1 packages below ${THRESHOLD}%:$FAILED"
            exit 1
          fi

      - name: Generate Cobertura XML
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.xml
            junit.xml

      - name: PR coverage comment
        if: github.event_name == 'pull_request'
        uses: 5monkeys/cobertura-action@master
        with:
          path: coverage.xml
          minimum_coverage: 80
          show_line: true
          show_branch: true
          show_missing: true
          skip_no_changes: true
