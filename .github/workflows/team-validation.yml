name: Team Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Initialize example project
        run: |
          python3 scripts/team_manager.py --project example --test-mode init

      - name: Validate team sizes
        # Report-only: a freshly initialized template has no assigned
        # members, so size violations are expected and the command exits
        # 1. What this step verifies is that the command runs end to end.
        run: |
          python3 scripts/team_manager.py --project example --test-mode validate-size || true

      - name: Check team status
        run: |
          python3 scripts/team_manager.py --project example --test-mode status

      - name: Export team configuration
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/team_manager.py --project example --test-mode export-json --file teams-export.json

      - name: Upload team export
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: teams-export
          path: teams-export.json

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        run: |
          pytest scripts/ -v --cov=scripts --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go tests
        # GOWORK=off: mcp-server is a nested module outside go.work; in
        # workspace mode go rejects ./... here ("directory prefix .
        # does not contain modules listed in go.work").
        run: |
          cd mcp-server
          GOWORK=off go test ./... -race

      - name: Build Go handlers
        run: |
          cd mcp-server
          GOWORK=off go build ./...

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build CLI
        run: |
          cd cmd/team-cli
          GOWORK=off go build -o team .

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: team-cli
          path: cmd/team-cli/team
