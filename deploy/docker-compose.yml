# Compose project name is pinned so the stack's networks/volumes never collide
# with other projects on a shared host. Run every compose command with -p oap
# (or copy this file's name into COMPOSE_PROJECT_NAME in .env): without it the
# project defaults to the directory name ("deploy") — on the ai04 test box that
# clashed with an unrelated "deploy" project's redis volume, and a `down -v`
# there would have destroyed foreign data.
#
# Port collisions: postgres/nats/monitor endpoints are bound to 127.0.0.1 so a
# host already running Postgres/NATS can co-exist. Change the left-hand side
# of the mappings if 5432/4222/8222 are taken. Never expose these ports beyond
# loopback on a shared box — see deploy/AI04_DEPLOY_NOTES.md.
services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback-only by default: on a shared host 5432 is usually taken (and
      # exposing Postgres publicly is never the intent). Remap the left side if
      # needed — see deploy/AI04_DEPLOY_NOTES.md.
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oap -d oap"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  nats:
    image: nats:2.10.22-alpine
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      SYS_PASSWORD: ${SYS_PASSWORD}
      OAP_SERVER_PASSWORD: ${OAP_SERVER_PASSWORD}
      AGENT_LOCAL_PASSWORD: ${AGENT_LOCAL_PASSWORD}
      A2A_GATEWAY_PASSWORD: ${A2A_GATEWAY_PASSWORD}
    ports:
      # Loopback-only. 6222 (cluster) and 7422 (gateway) are not exposed
      # because the corresponding nats.conf blocks are disabled for
      # single-node — re-add them together with the cluster block for HA.
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/certs:/etc/nats/certs:ro
      - nats_jetstream:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  dex:
    image: ghcr.io/dexidp/dex:v2.40.0
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - ./dex/static-users.yaml:/etc/dex/static-users.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5556/dex/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      dex:
        condition: service_healthy
    environment:
      HTTP_PORT: "8080"
      APP_ENV: development
      LOG_LEVEL: info
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # NATS requires mTLS + per-account credentials (nats.conf `verify: true`).
      # The server presents the client cert minted by nats/scripts/gen-certs.sh
      # and authenticates as user "oap-server" from the URL. A plain
      # nats://nats:4222 URL fails with "Authorization Violation".
      NATS_URL: tls://oap-server:${OAP_SERVER_PASSWORD}@nats:4222
      NATS_CA_FILE: /etc/oap-nats/ca.pem
      NATS_CERT_FILE: /etc/oap-nats/client-cert.pem
      NATS_KEY_FILE: /etc/oap-nats/client-key.pem
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      # OIDC_REDIRECT_URL stays the dex-registered /auth/callback (it is the
      # code-exchange redirect_uri). The browser's post-login destination is
      # now the separate POST_LOGIN_REDIRECT_URL (default "/").
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:8080/auth/callback}
      POST_LOGIN_REDIRECT_URL: ${POST_LOGIN_REDIRECT_URL:-/}
      # The server applies the embedded canonical schema (internal/db/
      # migrations) at boot. Set OAP_AUTO_MIGRATE=false for DBA-managed
      # databases; rollout then happens via `go run ./cmd/migrate up`.
      OAP_AUTO_MIGRATE: ${OAP_AUTO_MIGRATE:-true}
      # One-time first-boot org bootstrap token (auth-rbac spec §14).
      # Empty (default) disables POST /api/v1/auth/bootstrap entirely.
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      # mTLS client material for the server's NATS connection. Generated by
      # deploy/nats/scripts/gen-certs.sh --server-client (see script header).
      - ./nats/certs/ca.pem:/etc/oap-nats/ca.pem:ro
      - ./nats/certs/oap-server-client-cert.pem:/etc/oap-nats/client-cert.pem:ro
      - ./nats/certs/oap-server-client-key.pem:/etc/oap-nats/client-key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      network: host
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      # 127.0.0.1, not 'localhost' — IPv6-first resolution makes wget fail
      # against the IPv4-only nginx listener (container "unhealthy" while
      # serving 200s). See deploy/Dockerfile.web.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  pg_data:
  nats_jetstream:
