# Issuer MUST match OIDC_ISSUER_URL as seen by the server. The server runs in
# the compose network and reaches Dex at http://dex:5556/dex; coreos/go-oidc
# validates that the discovered issuer field equals the discovery URL exactly,
# so a mismatch (previously http://localhost:5556/dex) broke provider discovery
# and blocked all logins. The browser still authenticates via the redirect URIs
# below, which remain localhost.
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556

staticClients:
  - id: oap-web
    redirectURIs:
      - http://localhost:5173/auth/callback
      - http://localhost:8080/auth/callback
    name: "OAP Web"
    secret: oap-web-secret
    # trustedPeers REMOVED: dex v2.40 wants a list of client-ID STRINGS here,
    # and the block previously held {id, secret} objects — dex failed to start
    # with "error unmarshaling 'trustedPeers'". The oap-server client below is
    # registered independently and doesn't need peer trust for the OAP login
    # flow. If peer trust is ever needed, write it as: trustedPeers: ["oap-server"]
  - id: oap-server
    redirectURIs:
      - http://localhost:8080/oauth/callback
    name: "OAP Server"
    secret: oap-server-secret
    public: true

enablePasswordDB: true

# Local users — passwords hashed with bcrypt (cost 10).
# Both users have password "password". DO NOT USE IN PRODUCTION.
staticPasswords:
  - email: "admin@oap.local"
    # bcrypt hash of "password"
    hash: "$2a$10$ZJVcmZxy/NHf5.oWoDsLgu2.bxkBQFiG4yXchbNUmsmfNgOuTQd5O"
    username: "admin"
    userID: "00000000-0000-0000-0000-000000000001"
  - email: "tech@oap.local"
    # bcrypt hash of "password"
    hash: "$2a$10$He5peYLhFm9GL2NWaF9Oj.DSS4P.VkVFUlBImWWuLLLwdDdFlBOaq"
    username: "tech"
    userID: "00000000-0000-0000-0000-000000000002"
